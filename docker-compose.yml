services:
  db:
    image: mysql:8.0
    container_name: absenkan_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: absenkan
      MYSQL_USER: absenkan
      MYSQL_PASSWORD: absenkan
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - absenkan_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uabsenkan", "-pabsenkan"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  absenkan_mysql_data: