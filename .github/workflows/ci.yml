name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build --workspace backend

      - name: Test backend
        run: npm test --workspace backend

      - name: Build frontend
        run: npm run build --workspace frontend

  docker-build:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t absenkan-backend -f backend/Dockerfile .

      - name: Build frontend image
        run: docker build -t absenkan-frontend -f frontend/Dockerfile .
